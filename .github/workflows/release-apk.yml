name: Build Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  JAVA_VERSION: 21

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradlew Permission
        run: chmod +x gradlew

      # Your existing CI already stores google-services.json as raw JSON
      # in the GOOGLE_SERVICES_JSON repository secret.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="$(
            find . \
              -path '*/build/outputs/apk/release/*-release-unsigned.apk' \
              -type f \
              | head -n 1
          )"

          if [ -n "$UNSIGNED_APK" ]; then
            SOURCE_APK="$UNSIGNED_APK"
          else
            SOURCE_APK="$(
              find . \
                -path '*/build/outputs/apk/release/*.apk' \
                -type f \
                | head -n 1
            )"
          fi

          if [ -z "$SOURCE_APK" ]; then
            echo "::error::Could not find a release APK after assembleRelease."
            find . -path '*/build/outputs/apk/release/*.apk' -type f || true
            exit 1
          fi

          echo "Release APK: $SOURCE_APK"

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android Build Tools were not found."
            exit 1
          fi

          mkdir -p dist

          "$BUILD_TOOLS_DIR/zipalign" \
            -v \
            -p \
            -f \
            4 \
            "$SOURCE_APK" \
            dist/app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/app-release.apk \
            dist/app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            dist/app-release.apk

          rm dist/app-release-aligned.apk

      - name: Upload release APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: dist/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="main-build-${{ github.run_number }}"

          gh release create "$TAG" \
            dist/app-release.apk \
            --target "${{ github.sha }}" \
            --title "Main Build #${{ github.run_number }}" \
            --notes "Automated signed release APK built from main at commit ${{ github.sha }}." \
            --prerelease
