name: Build Release APK

on:
  push:
    branches:
      - main

  # Also allows manually running it from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # Java / Gradle
      # ---------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ---------------------------------------------------------
      # Restore release keystore
      # ---------------------------------------------------------

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

      # ---------------------------------------------------------
      # Build unsigned Release APK
      # ---------------------------------------------------------

      - name: Build release APK
        run: ./gradlew assembleRelease

      # ---------------------------------------------------------
      # Find + align + sign APK
      # ---------------------------------------------------------

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding unsigned release APK..."

          UNSIGNED_APK="$(
            find . \
              -path '*/build/outputs/apk/release/*-release-unsigned.apk' \
              -type f \
              | head -n 1
          )"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Could not find unsigned release APK."
            echo "Available release APK files:"
            find . -path '*/build/outputs/apk/release/*.apk' -type f || true
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          echo "Android Build Tools: $BUILD_TOOLS_DIR"

          mkdir -p dist

          # Align before signing
          "$BUILD_TOOLS_DIR/zipalign" \
            -v \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            dist/app-release-aligned.apk

          # Sign using the real release key
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/app-release.apk \
            dist/app-release-aligned.apk

          # Verify signature
          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            dist/app-release.apk

          rm dist/app-release-aligned.apk

      # ---------------------------------------------------------
      # Upload to GitHub Actions
      # ---------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ github.run_number }}
          path: dist/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Attach APK to Repository → Releases
      # ---------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="main-build-${{ github.run_number }}"

          gh release create "$TAG" \
            dist/app-release.apk \
            --target "${{ github.sha }}" \
            --title "Main Build #${{ github.run_number }}" \
            --notes "Automated release APK built from commit ${{ github.sha }}." \
            --prerelease